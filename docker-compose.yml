services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudopsacademy
      POSTGRES_USER: cloudops
      POSTGRES_PASSWORD: cloudops-local
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudops -d cloudopsacademy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 3000
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: cloudopsacademy
      PGUSER: cloudops
      PGPASSWORD: cloudops-local
      JWT_SECRET: bookingkg-local-development-secret
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
